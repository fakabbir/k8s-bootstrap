apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo
resources:
  - ../../../base
labels:
  - pairs:
      app.kubernetes.io/environment: production
replicas:
  - name: demo-app
    count: 2
patches:
  - target:
      kind: Deployment
      name: demo-app
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: demo-app
      spec:
        template:
          spec:
            containers:
              - name: nginx
                env:
                  - name: DEPLOY_ENV
                    value: production
