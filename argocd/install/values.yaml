# Values for the argo-cd Helm chart, installed on the deployer cluster.
# Chart: argo/argo-cd 10.9.6 (Argo CD v3.5.3). Version is pinned by build.sh.

server:
  service:
    # Reached with `kubectl port-forward`, so no LoadBalancer/Ingress needed.
    type: ClusterIP

configs:
  params:
    # Serve plain HTTP from the API pod. port-forward then gives http://localhost:8080
    # with no self-signed-certificate warnings in the browser.
    server.insecure: true
    # Argo CD's default is 3 minutes between Git polls, which makes the first
    # "push and watch it deploy" feel broken. A laptop lab benefits from 60s.
    timeout.reconciliation: 60s

global:
  networkPolicy:
    # The chart creates these by default, and each one restricts a component's
    # ingress to just the metrics port. kindnet (kind's CNI) then drops the DNS
    # responses coming back to those pods, because it treats a reply as unsolicited
    # ingress instead of conntrack-established traffic. Argo CD consequently cannot
    # resolve a single name: repo-server CrashLoops on its redis health check and
    # every Application sticks at sync status Unknown with
    # "lookup argocd-repo-server on 10.97.0.10:53: i/o timeout".
    # Deleting the policies made resolution instant again.
    create: false

# Dex fronts SSO; local admin login is enough here and it saves a container.
dex:
  enabled: false

# Not used yet; disable so the control plane stays a four-deployment footprint.
notifications:
  enabled: false
