apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  description: Workloads promoted to the production cluster (orbstack)
  sourceRepos:
    - https://github.com/fakabbir/k8s-bootstrap.git
  destinations:
    - name: orbstack-prod
      namespace: '*'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ''
      kind: '*'
    - group: apps
      kind: '*'
  orphanizeResources: false
