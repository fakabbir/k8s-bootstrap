# Shape of the Secret build.sh generates per member cluster, applied into the
# argocd namespace of the *deployer* cluster. A Secret carrying this label is
# Argo CD's declarative "cluster" record, so no `argocd cluster add` is needed.
#
# The real one is assembled with jq by build.sh and written to .work/clusters/
# (gitignored) because it holds a cluster-admin bearer token.
#
# metadata.name doubles as the cluster's symbolic name, which is what the
# ApplicationSets' destination.name and the AppProjects' destinations match on.
apiVersion: v1
kind: Secret
metadata:
  name: dev-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: dev-cluster
  # Reachable from inside the deployer cluster, not from a laptop: kind's
  # 127.0.0.1:<published-port> address would fail here.
  server: https://192.168.107.3:6443
  config: |
    {
      "bearerToken": "<token from argocd/clusters/manager-rbac.yaml>",
      "tlsClientConfig": {
        "caData": "<base64 of the member cluster's CA bundle>"
      }
    }
# When the API certificate has no SAN matching the address Argo CD must use,
# build.sh swaps caData for "insecure": true instead of failing the handshake:
#   "tlsClientConfig": { "insecure": true }
